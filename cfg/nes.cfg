SYMBOLS {
    __STACKSIZE__: type = weak, value = $0200; # 2 pages stack
}
MEMORY {
    ZP:     file = "", start = $0002, size = $001A, type = rw, define = yes;

    # NES2.0 Cartridge Header
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;

    # 1 32K ROM Bank
    # - startup
    # - code
    # - rodata
    # - data (load)
    ROM0:   file = %O, start = $8000, size = $7FFA, fill = yes, define = yes;

    # Hardware Vectors at End of 2nd 8K ROM
    ROMV:   file = %O, start = $FFFA, size = $0006, fill = yes;

    # 1 8k CHR Bank
    ROM1:   file = %O, start = $0000, size = $2000, fill = yes;

    # Standard 2k SRAM in console(-zeropage)
    # $0100-$0200 cpu stack
    # $0200-$0300 OAM buffer (not currently used outside initialization)
    # $0300-$0400 ppu memory write buffer
    # $0400-$0800 4 pages of extra BSS
    RAM2:   file = "", start = $0400, size = $0400,         define = yes;

    # Additional 8K SRAM in cartridge (battery-backed by default)
    # - data (run)
    # - bss
    # - heap
    # - stack

    RAM:    file = "", start = $6000, size = $1E00, define = yes;
    # An additional BSS segment could be added here if you wish to use
    # the battery-backed functionality

    STACK:  file = "", start = $7E00, size = __STACKSIZE__, define = yes;
    # See issue #2999 for why the stack is here and not in the console's memory
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    HEADER:   load = HEADER,          type = ro;
    STARTUP:  load = ROM0,            type = ro,  define   = yes;
    LOWCODE:  load = ROM0,            type = ro,  optional = yes;
    ONCE:     load = ROM0,            type = ro,  optional = yes;
    CODE:     load = ROM0,            type = ro,  define   = yes;
    RODATA:   load = ROM0,            type = ro,  define   = yes;
    DATA:     load = ROM0, run = RAM, type = rw,  define   = yes;
    VECTORS:  load = ROMV,            type = ro;
    CHARS:    load = ROM1,            type = ro;
    BSS:      load = RAM,             type = bss, define   = yes;
    BSS2:     load = RAM2,            type = bss, optional = yes, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
